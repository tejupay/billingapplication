services:
  - type: web
    name: business-erp-backend
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    dockerContext: ./backend
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: APP_JWT_SECRET
        value: 9a2f8c7e1d4b6a3f5e0c8b7a6d5c4b3a2f1e0d9c8b7a6f5e4d3c2b1a0f9e8d7c

  - type: web
    name: business-erp-frontend
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: VITE_API_URL
        value: https://business-erp-backend.onrender.com
